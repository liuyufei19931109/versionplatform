name: Checks

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    name: Backend regression subset and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile all test sources, run the portable JUnit subset, and build the JAR
        run: mvn --batch-mode --no-transfer-progress -Dtest=ApiExceptionHandlerTest,BrandingLogoTest,DeploymentReviewTest,GitHubBackendBuildServiceTest,GitHubFrontendBuildServiceTest,MenuPermissionsTest,ProductionGateTest,ServiceBuildEngineSelectionTest package
      - name: Test runtime scripts with local fixtures
        run: python3 -m unittest discover -s src/test/python -p 'test_*.py'
